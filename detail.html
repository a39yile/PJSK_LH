<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>卡片详情 - Project SEKAI</title>
    <style>
        /* 基础样式重置 */
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #1a1a1a; overflow: hidden; display: flex; justify-content: center; align-items: center; }
        
        /* 返回按钮样式 */
        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-family: sans-serif;
            backdrop-filter: blur(5px);
            transition: background 0.3s;
            z-index: 10;
            cursor: pointer;
        }
        .back-btn:hover { background: rgba(255, 255, 255, 0.4); }

        /* 底部两排文字信息栏：小字号、无描边，颜色跟随卡片团队色（JS 注入） */
        .detail-info {
            position: absolute;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            max-width: 90%;
            text-align: center;
            z-index: 10;
        }
        .detail-line1 { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: center; }
        .detail-name { font-size: 0.95rem; }
        .detail-type { font-size: 0.75rem; padding: 1px 8px; border-radius: 10px; }
        .detail-line2 { font-size: 0.85rem; }
        .detail-char { cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
        .detail-char:hover { filter: brightness(1.3); }

        /* 图片容器 */
        .img-container {
            max-width: 90%;
            max-height: 90%;
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
            border-radius: 4px;
            overflow: hidden;
        }
        
        /* 全站背景图接入 */
        body {
            background-image: url('icon/bg.jpg');
            background-size: cover;
            background-position: center;
        }
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            z-index: -1;
            background: rgba(16, 16, 20, 0.78);
        }

        .img-container img {
            width: 100%;
            height: 100%;
            object-fit: contain; 
            display: block;
        }

        /* PC 适配（≥1024px） */
        @media (min-width: 1024px) {
            .img-container { max-width: 62%; max-height: 80vh; }
            .back-btn { top: 28px; left: 28px; font-size: 1rem; padding: 12px 24px; }
            .detail-info { bottom: 32px; }
            .detail-name { font-size: 1.1rem; }
            .detail-line2 { font-size: 0.95rem; }
        }
    </style>
</head>
<body>

    <!-- 修复：history.back() 在无浏览历史时（如新标签页直接打开）无效，增加回退跳转 -->
    <div class="back-btn" onclick="goBack()">← 返回上一页</div>

    <div class="img-container">
        <img id="detailImage" src="" alt="卡片大图">
    </div>

    <!-- 第一排：卡名+种类 | 第二排：角色名字:角色名（点击跳「关于」页展开对应团队卡片） -->
    <div class="detail-info" id="detailInfo">
        <div class="detail-line1">
            <span class="detail-name" id="detailName"></span>
            <span class="detail-type" id="detailType"></span>
        </div>
        <div class="detail-line2"><span id="detailLabel">角色名字：</span><span class="detail-char" id="detailChar"></span></div>
    </div>

    <script>
        function goBack() {
            // 有浏览历史则正常返回；否则（新标签页/直接打开）跳回主页
            if (window.history.length > 1) {
                window.history.back();
            } else {
                window.location.href = 'index.html';
            }
        }

        // PC 适配：按 Esc 键等同点击返回
        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape') goBack();
        });

        // 团队顺序（与「关于」页卡片顺序一致）与团队色
        const GROUPS_ORDER = ['Leo/need', 'MORE MORE JUMP!', 'Vivid BAD SQUAD', 'Wonderlands×Showtime', '25时，在Nightcord见', 'Virtual Singers'];
        const TEAM_COLORS = {
            'Leo/need': '#4455DD', 'MORE MORE JUMP!': '#88DD44', 'Vivid BAD SQUAD': '#EE1166',
            'Wonderlands×Showtime': '#FF9900', '25时，在Nightcord见': '#884499', 'Virtual Singers': '#33CCBB',
        };

        window.onload = function() {
            const p = new URLSearchParams(window.location.search);
            const imgSrc = p.get('img');
            const imgElement = document.getElementById('detailImage');

            if (!imgSrc) {
                imgElement.alt = "未找到图片信息";
                document.querySelector('.img-container').style.background = "#333";
                return;
            }
            imgElement.src = imgSrc;
            if (!p.get('name')) return; // 旧链接无文字参数时只显图

            const gIdx = parseInt(p.get('g'));
            const color = (gIdx >= 0 && gIdx < GROUPS_ORDER.length) ? TEAM_COLORS[GROUPS_ORDER[gIdx]] : '#888';

            const info = document.getElementById('detailInfo');
            info.style.display = 'flex';
            info.style.color = color;   // 两排文字统一团队色，与卡片描边一致

            document.getElementById('detailName').textContent = p.get('name');
            const typeEl = document.getElementById('detailType');
            typeEl.textContent = p.get('type');
            typeEl.style.color = color;
            typeEl.style.background = 'rgba(255,255,255,0.14)';
            document.getElementById('detailLabel').style.color = color;

            const charEl = document.getElementById('detailChar');
            charEl.textContent = p.get('char');
            charEl.addEventListener('click', function () {
                location.href = 'index.html#mine?open=' + gIdx;
            });
        }
    </script>

</body>
</html>
