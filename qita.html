<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>其他 - Project SEKAI</title>

    <style>
        /* 兜底底色：跳转途中即使被渲染一帧，也不会是一块刺眼的白 */
        html { background: #ffffff; color-scheme: light; }
        html[data-theme="dark"] { background: #121212; color-scheme: dark; }
        body { margin: 0; background: transparent; }
    </style>

    <script>
    /* 「其他」页已并入单页（index.html#qita），这里只负责把旧链接接过去。
       在 head 里同步跳转，body 根本不会被绘制，跨页跳转的白屏也就消失了。 */
    (function () {
      try {
        var keys = ['theme', 'data-theme', 'pjsk-theme', 'pjsk_theme', 'color-theme', 'colorScheme'];
        for (var i = 0; i < keys.length; i++) {
          var v = localStorage.getItem(keys[i]);
          if (!v) continue;
          v = String(v).toLowerCase();
          if (v.indexOf('dark') !== -1) { document.documentElement.setAttribute('data-theme', 'dark'); break; }
          if (v.indexOf('light') !== -1 || v.indexOf('white') !== -1) { document.documentElement.setAttribute('data-theme', 'light'); break; }
        }
      } catch (e) {}
      window.location.replace('index.html#qita');
    })();
    </script>
</head>
<body>
    <script>window.location.replace('index.html#qita');</script>
    <noscript>
        <p style="text-align:center;font-family:sans-serif;padding:40px;color:#888;">
            请开启 JavaScript，或<a href="index.html#qita">点击进入「其他」页</a>。
        </p>
    </noscript>
</body>
</html>
