    <script>
    /* 主题预设：必须在首帧绘制「之前」同步执行。
       原来主题是靠 body 底部的 script.js 才写到 <html data-theme> 上的，
       在它执行前浏览器已经用白底画过一帧 —— 暗色模式下这就是一次明显的闪白，
       刷新页面、从别的页面跳回来时都会出现。
       这里提前读一次本地存储；后面 script.js 再执行一遍结果一致，无副作用。 */
    (function () {
      try {
        var keys = ['theme', 'data-theme', 'pjsk-theme', 'pjsk_theme', 'color-theme', 'colorScheme'];
        for (var i = 0; i < keys.length; i++) {
          var v = localStorage.getItem(keys[i]);
          if (!v) continue;
          v = String(v).toLowerCase();
          if (v.indexOf('dark') !== -1) { document.documentElement.setAttribute('data-theme', 'dark'); break; }
          if (v.indexOf('light') !== -1 || v.indexOf('white') !== -1) { document.documentElement.setAttribute('data-theme', 'light'); break; }
        }
      } catch (e) {}
    })();
    </script>
